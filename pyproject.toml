[project]
name = "solarflare"
version = "1.0.0"
description = "Flare nowcasting and forecasting from Aditya-L1 SoLEXS + HEL1OS X-ray data"
requires-python = ">=3.11"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "NPY"]
ignore = [
  "E501",    # line length is handled by review, not the linter
  "E741",    # `l` is a reasonable name for an HDU list in io code
  "B905",    # zip(strict=) not required for the fixed-length pairs used here
  "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import inside functions to keep import cost off the
# module level, and shadow names for readability.
"tests/*" = ["E402", "F401"]
